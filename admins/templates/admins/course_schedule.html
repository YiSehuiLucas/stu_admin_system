<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>管理员部分 - 查看课程计划表</title>
    <style>
        /* From Uiverse.io by CristianMontoya98 */
        .btn {
            width: 6.5em;
            height: 2.3em;
            margin: 0.5em;
            background: black;
            color: white;
            border: none;
            border-radius: 0.625em;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        button:hover {
            color: black;
        }

        button:after {
            content: "";
            background: white;
            position: absolute;
            z-index: -1;
            left: -20%;
            right: -20%;
            top: 0;
            bottom: 0;
            transform: skewX(-45deg) scale(0, 1);
            transition: all 0.5s;
        }

        button:hover:after {
            transform: skewX(-45deg) scale(1, 1);
            -webkit-transition: all 0.5s;
            transition: all 0.5s;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h3 {
            text-align: center;
   197761FF         margin-bottom: 30px;
            font-weight: bold;
            color: #197761;
        }

        .form-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            border: 2px solid #197761;
            border-radius: 10px;
            background-color: #f9f9f9;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }

        .form-group input,
        .form-group select,
        .form-group button {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .form-group button {
            background-color: #197761;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .form-group button:hover {
            background-color: #197761;
        }

        .form-inline {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
        }

        .form-inline .form-group {
            flex: 1;
            margin: 0 10px;
        }

        .form-inline .form-group:first-child {
            margin-left: 0;
        }

        .form-inline .form-group:last-child {
            margin-right: 0;
        }

        .submit-btn {
            text-align: center;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
            margin: 20px 0;
        }

        .table-bordered {
            border: 2px solid #197761;
        }

        .table thead th {
            background-color: #197761;
            color: white;
            text-align: center;
            padding: 10px;
        }

        .table tbody tr {
            background-color: #f9f9f9;
            transition: background-color 0.3s;
        }

        .table tbody tr:hover {
            background-color: #f1f1f1;
        }

        .table td {
            text-align: center;
            padding: 10px;
            border: 1px solid #ddd;
        }

        .table tbody td {
            color: #333;
        }
    </style>
</head>
<body>
<h3>添加新课程计划</h3>
<div class="form-container">
    <form method="POST" action="{% url 'courser_schedule' %}">
        {% csrf_token %}
        <div class="form-inline">
            <div class="form-group" style="width: 10px">
                <label for="course-id">课程编号</label>
                <select id="course-id" name="course-id" required>
                    {% for id in curses %}
                    <option value="{{ id }}">{{ id }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="teacher-id">教师编号</label>
                <select id="teacher-id" name="teacher-id" required>
                    {% for id in teacher %}
                    <option value="{{ id }}">{{ id }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-inline">
            <div class="form-group">
                <label for="course-day">星期几</label>
                <select id="course-day" name="day_of_week" required>
                    <option value="周一">星期一</option>
                    <option value="周二">星期二</option>
                    <option value="周三">星期三</option>
                    <option value="周四">星期四</option>
                    <option value="周五">星期五</option>
                    <option value="周六">星期六</option>
                    <option value="周日">星期日</option>
                </select>
            </div>
            <div class="form-group">
                <label for="time">上课时间</label>
                <select id="time" name="time" required>
                    {% for time in time %}
                    <option value="{{ time }}">{{ time.0 }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-inline">
            <div class="form-group">
                <label for="course-start-week">开始周</label>
                <select id="course-start-week" name="start_week" required>
                    {% for week in weeks %}
                    <option value="{{ week }}">第{{ week }}周</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="course-end-week">结束周</label>
                <select id="course-end-week" name="end_week" required>
                    {% for week in weeks %}
                    <option value="{{ week }}">第{{ week }}周</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-inline">
            <div class="form-group">
                <label for="course-classroom">上课教室</label>
                <input style="width: 368px" type="text" id="course-classroom" name="classroom" placeholder="输入上课教室" required>
            </div>
            <div class="submit-btn" style="margin-top: 16px">
            <button type="submit" class="btn">确定添加
            </button>
        </div>
        </div>


    </form>
</div>





    <h3>全部课程计划</h3>
    <div>
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>课程号</th>
                    <th>课程名</th>
                    <th>任课教师编号</th>
                    <th>任课教师姓名</th>
                    <th>星期几</th>
                    <th>上课时间</th>
                    <th>上课教室</th>
                    <th>开始周</th>
                    <th>结束周</th>
                </tr>
            </thead>
            <tbody>
                {% for item in info %}
                <tr>
                    <td>{{ item.0 }}</td>
                    <td>{{ item.1 }}</td>
                    <td>{{ item.7 }}</td>
                    <td>{{ item.8 }}</td>
                    <td>{{ item.3 }}</td>
                    <td>{{ item.4 }}</td>
                    <td>{{ item.2 }}</td>
                    <td>{{ item.5 }}</td>
                    <td>{{ item.6 }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>

</html>
