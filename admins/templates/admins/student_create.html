<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员部分 - 学生信息导入</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #74ebd5, #acb6e5);
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 750px;
            background-color: #fff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 2rem;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group span {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            background: #f9f9f9;
            transition: border-color 0.3s ease, background-color 0.3s ease;
        }

        .input:focus {
            outline: none;
            border-color: #4caf50;
            background-color: #e8f5e9;
        }

        select {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: #f9f9f9;
            font-size: 1rem;
        }

        button {
            display: block;
            width: 100%;
            padding: 15px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            background: #4caf50;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        button:hover {
            background: #45a049;
        }

        button:active {
            transform: scale(0.98);
        }

        small {
            display: block;
            margin-top: 5px;
            color: red;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.5rem;
            }

            .container {
                padding: 20px;
            }

            button {
                padding: 12px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>添加学生</h1>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <span>学生姓名</span>
            <input type="text" name="name" class="input" placeholder="学生姓名">
        </div>

        <div class="form-group">
            <span>学生学号</span>
            <input type="text" name="id" class="input" placeholder="学号">
        </div>

        <div class="form-group">
            <span>学生专业</span>
            <select id="major" name="major" required>
                {% for major in major_list %}
                    <option value="{{ major.0 }}">{{ major.0 }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <span>学生班级</span>
            <select id="class_room" name="class_room" required>
                {% for class in class_room_list %}
                    <option value="{{ class }}">{{ class }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <span>联系电话</span>
            <input type="text" name="phone" id="phone" class="input" placeholder="联系电话" maxlength="11">
            <small id="phone-error" style="display: none;">请输入11位数字</small>
        </div>
        <script>
            const phoneInput = document.getElementById("phone");
            const phoneError = document.getElementById("phone-error");

            phoneInput.addEventListener("input", function () {
                const value = phoneInput.value;
                phoneInput.value = value.replace(/\D/g, '');

                if (phoneInput.value.length !== 11) {
                    phoneError.style.display = "block";
                } else {
                    phoneError.style.display = "none";
                }
            });
        </script>

        <div class="form-group">
            <span>学生年级</span>
            <select name="grade" class="input">
                <option value="大一上">大一上</option>
                <option value="大一下">大一下</option>
                <option value="大二上">大二上</option>
                <option value="大二下">大二下</option>
                <option value="大三上">大三上</option>
                <option value="大三下">大三下</option>
                <option value="大四上">大四上</option>
                <option value="大四下">大四下</option>
            </select>
        </div>

        <button type="submit">确定添加</button>
    </form>
</div>
</body>
</html>
