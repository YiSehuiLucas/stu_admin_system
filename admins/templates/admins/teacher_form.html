{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员端 - 创建教师信息</title>
    <style>
        /* 设置全局背景样式 */
        body {
            background: linear-gradient(to right, #6a11cb, #2575fc); /* 渐变背景 */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 页面容器样式 */
        .teacher-form-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        .teacher-form {
            background-color: rgba(255, 255, 255, 0.9); /* 半透明背景 */
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
            box-sizing: border-box;
        }

        /* 标题样式 */
        .teacher-form h3 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-size: 28px;
            font-weight: 600;
        }

        /* 表单样式 */
        .teacher-form form {
            display: flex;
            flex-direction: column;
        }

        .teacher-form .form-group {
            margin-bottom: 20px;
        }

        .teacher-form label {
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .teacher-form .form-group input,
        .teacher-form .form-group select {
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
            width: 100%;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .teacher-form .form-group input:focus,
        .teacher-form .form-group select:focus {
            border-color: #4CAF50;
            outline: none;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.4);
        }

        /* 提交按钮样式 */
        .teacher-form .btn-submit {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            margin-top: 20px;
        }

        .teacher-form .btn-submit:hover {
            background-color: #0056b3;
            transform: translateY(-3px);
        }

        /* 错误信息样式 */
        .teacher-form .text-danger {
            font-size: 0.9rem;
            color: #dc3545;
            margin-top: 0.5rem;
        }

        /* 返回按钮样式 */
        .teacher-form .btn-secondary {
            background-color: #6c757d;
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
            margin-top: 15px;
            text-align: center;
            transition: background-color 0.3s;
        }

        .teacher-form .btn-secondary:hover {
            background-color: #5a6268;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .teacher-form {
                padding: 25px;
            }

            .teacher-form h3 {
                font-size: 24px;
            }

            .teacher-form .form-group input,
            .teacher-form .form-group select {
                font-size: 14px;
            }

            .teacher-form .btn-submit,
            .teacher-form .btn-secondary {
                font-size: 14px;
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="teacher-form-container">
        <div class="teacher-form">
            <h3>创建教师信息</h3>

            <form method="post" action="{% url 'teacher_create' %}">
                {% csrf_token %}
                <div class="form-group">
                    <label for="user_id">教师ID</label>
                    <input type="text" class="form-control" id="user_id" name="user_id" placeholder="输入教师ID" required>
                </div>
                <div class="form-group">
                    <label for="tch_name">教师姓名</label>
                    <input type="text" class="form-control" id="tch_name" name="tch_name" placeholder="输入教师姓名" required>
                </div>
                <div class="form-group">
                    <label for="tch_phnum">联系电话</label>
                    <input type="text" class="form-control" id="tch_phnum" name="tch_phnum" placeholder="输入联系电话" required>
                </div>
                <div class="form-group">
                    <label for="depart_id">所属部门ID</label>
                    <input type="text" class="form-control" id="depart_id" name="depart_id" placeholder="输入部门ID" required>
                </div>
                <button type="submit" class="btn-submit">创建</button>
                <a href="{% url 'teacher_list' %}" class="btn-secondary">返回</a>
            </form>
        </div>
    </div>
</body>
</html>
